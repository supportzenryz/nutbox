name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutbox
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutbox_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: createdb -h localhost -U postgres nutbox
        env:
          PGPASSWORD: postgres
      - run: npm run db:migrate && npm run db:seed
      - run: npm run build
